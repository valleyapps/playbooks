---
- name: update-apt-packages
  hosts: raspberrypis  # Change to match your inventory group or hostname
  become: yes         # Use 'become' to run tasks with elevated privileges
  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Upgrade installed packages
      apt:
        upgrade: dist     # 'dist' handles distribution upgrades (kernel, etc.)
        autoremove: yes   # Remove obsolete packages
      register: upgrade_info

    - name: Reboot the system if necessary
      reboot:
        msg: "System reboot initiated by Ansible after upgrade."
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: upgrade_info.changed
